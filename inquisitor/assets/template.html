<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1c1b19; --mute:#6b6a65; --line:#dedbd3;
  --accent:#4b3fd6; --accent-ink:#ffffff; --rec:#0f7b4f; --rec-bg:#e5f4ec;
  --warn:#a85a00; --warn-bg:#fff1dc; --bad:#b3261e; --bad-bg:#fdeceb; --ok-bg:#eef0ff; --code:#efece4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --panel:#1b1b1f; --ink:#ecebe6; --mute:#9b9a94; --line:#33333a;
    --accent:#8f86ff; --accent-ink:#0e0d1a; --rec:#5fd49c; --rec-bg:#12281e;
    --warn:#f0b05a; --warn-bg:#2d2110; --bad:#ff8a80; --bad-bg:#2e1614; --ok-bg:#1d1c33; --code:#2a2a30;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --panel:#1b1b1f; --ink:#ecebe6; --mute:#9b9a94; --line:#33333a;
  --accent:#8f86ff; --accent-ink:#0e0d1a; --rec:#5fd49c; --rec-bg:#12281e;
  --warn:#f0b05a; --warn-bg:#2d2110; --bad:#ff8a80; --bad-bg:#2e1614; --ok-bg:#1d1c33; --code:#2a2a30;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:0.88em ui-monospace,Consolas,monospace}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:3px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
input[type=text],textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:54px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
#top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em}
#bar{flex:1 1 180px;min-width:140px;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
#bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
#count{font-size:13px;color:var(--mute);white-space:nowrap}
#save{font-size:13px;padding:3px 9px;border-radius:99px;white-space:nowrap}
#save.ok{background:var(--rec-bg);color:var(--rec)} #save.warn{background:var(--warn-bg);color:var(--warn)} #save.bad{background:var(--bad-bg);color:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
#wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto}
#nav{position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto;padding:16px 8px 16px 16px;font-size:13.5px}
#nav a{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:7px;color:var(--ink);text-decoration:none}
#nav a:hover{background:var(--ok-bg)}
#nav a span.n{color:var(--mute);font-variant-numeric:tabular-nums}
#nav a.done span.n{color:var(--rec)}
#nav .filters{margin:0 0 12px;padding:0 9px;color:var(--mute);display:grid;gap:5px}
#nav .filters label{display:flex;gap:7px;align-items:center;cursor:pointer}
main{padding:16px;min-width:0}
@media (max-width:820px){#wrap{grid-template-columns:1fr}#nav{position:static;max-height:none;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:4px}#nav .filters{width:100%}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.box h2{margin:0 0 6px;font-size:17px}
.box p{margin:6px 0}
.cols ul,.box ul{margin:4px 0;padding-left:18px}
.cols li,.box li{margin:3px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cols h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:12px 0 4px}
details summary{cursor:pointer;font-weight:600}
.tension{border-left:3px solid var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:0 7px 7px 0;margin:6px 0}
section.sec{margin:26px 0 0}
section.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
section.sec h2{font-size:20px;margin:0}
section.sec .blurb{color:var(--mute);margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.card.answered{border-left:4px solid var(--accent)} .card.deferred{border-left:4px solid var(--warn)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qid{font:600 12px ui-monospace,Consolas,monospace;background:var(--ok-bg);color:var(--accent);padding:2px 7px;border-radius:5px;flex:none;margin-top:2px}
.qtext{font-weight:620;font-size:15.5px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;font-weight:600}
.tag.blocker{background:var(--bad-bg);color:var(--bad)} .tag.important{background:var(--warn-bg);color:var(--warn)} .tag.later{background:var(--code);color:var(--mute)}
.why{color:var(--mute);margin:6px 0 10px;font-size:14px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.opt:hover{border-color:var(--accent)} .opt.sel{border-color:var(--accent);background:var(--ok-bg)}
.opt input{margin-top:4px;flex:none}
.opt .t{font-weight:560} .opt .d{color:var(--mute);font-size:13.5px}
.rec{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--rec-bg);color:var(--rec);padding:1px 7px;border-radius:99px;margin-left:6px}
.recwhy{font-size:13.5px;color:var(--rec);background:var(--rec-bg);padding:6px 10px;border-radius:8px;margin:8px 0 0}
.extra{display:grid;gap:6px;margin-top:10px} .extra label{font-size:12.5px;color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.row .st{margin-left:auto;font-size:12.5px;color:var(--mute)}
.bulk{display:flex;gap:6px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>

<div id="top">
  <h1 id="ttl"></h1>
  <div id="bar"><i></i></div>
  <span id="count"></span>
  <span id="save" class="warn">Not connected</span>
  <div class="tools">
    <button id="bConnect" class="small" title="Choose this inquisitor folder once; answers.md is then written here after every answer">Connect folder</button>
    <button id="bFinal" class="small primary">Finish</button>
    <button id="bTheme" class="small" title="Toggle light / dark">◐</button>
  </div>
</div>

<div id="wrap">
  <nav id="nav" aria-label="Sections"></nav>
  <main>
    <div class="box" id="intro"></div>
    <div id="ctx"></div>
    <div id="sections"></div>
    <div style="height:80px"></div>
  </main>
</div>

<dialog id="dlg"></dialog>
<div id="toast"></div>

<script id="spec" type="application/json">/*__SPEC__*/null</script>
<script>
"use strict";
const SPEC=JSON.parse(document.getElementById("spec").textContent);
const SECTIONS=SPEC.sections, Q=SPEC.questions.map(q=>({
  id:q.id, sec:q.section, tag:q.priority||"important", q:q.text, why:q.why||"", multi:!!q.multi,
  opts:(q.options||[]).map(o=>({t:o.label,d:o.detail||"",rec:!!o.recommended})),
  rec:q.recommendation||"", text:q.freeText||""
}));
const ANSWERS_FILE=SPEC.answersFile||"answers.md";
const KEY="inquisitor:"+SPEC.id;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const k of kids.flat())if(k!=null)e.append(k.nodeType?k:document.createTextNode(k));return e};
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");

let state={v:1,answers:{},updated:null,finalized:null};   // answers[id]={sel:[idx],other,note,deferred,bulk}
let dirHandle=null, dirty=false, writing=false, writeAgain=false, saveTimer=null;
const FSA=!!window.showDirectoryPicker;
const ans=id=>state.answers[id]||(state.answers[id]={sel:[],other:"",note:"",deferred:false,bulk:false});
const isAnswered=id=>{const a=state.answers[id];return !!a&&(a.sel.length>0||a.other.trim()!=="")};
const isDeferred=id=>{const a=state.answers[id];return !!a&&a.deferred&&!isAnswered(id)};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400)}

/* ---------- markdown ---------- */
function chosenText(q){
  const a=state.answers[q.id]; if(!a) return [];
  const out=a.sel.map(i=>q.opts[i]&&q.opts[i].t).filter(Boolean);
  if(a.other.trim()) out.push("(own answer) "+a.other.trim());
  return out;
}
function buildMd(final){
  const total=Q.length, done=Q.filter(q=>isAnswered(q.id)).length, def=Q.filter(q=>isDeferred(q.id)).length;
  const bulk=Q.filter(q=>isAnswered(q.id)&&state.answers[q.id].bulk).length;
  const L=[`# ${SPEC.title}: answers`,"",
   `Status: **${final?"FINAL":"IN PROGRESS"}** · answered ${done}/${total} · deferred ${def} · unanswered ${total-done-def} · accepted in bulk ${bulk} · updated ${new Date().toISOString()}`,"",
   `> ${SPEC.readerNote}`,""];
  for(const s of SECTIONS){
    L.push(`## ${s.id}. ${s.title}`,"");
    for(const q of Q.filter(x=>x.sec===s.id)){
      const a=state.answers[q.id];
      L.push(`### ${q.id}. ${q.q}  \`[${q.tag}]\``);
      if(isAnswered(q.id)){
        const picks=chosenText(q);
        L.push(picks.length>1?"- **Answer:**":`- **Answer:** ${picks[0]}`);
        if(picks.length>1) picks.forEach(p=>L.push(`  - ${p}`));
        const recs=q.opts.map((o,i)=>o.rec?i:-1).filter(i=>i>=0);
        if(recs.length){
          const same=recs.length===a.sel.length&&recs.every(i=>a.sel.includes(i))&&!a.other.trim();
          L.push(`- **Matches recommendation:** ${same?"yes":"no"}${a.bulk?" (accepted in bulk)":""}`);
        } else if(a.bulk) L.push("- **Accepted in bulk**");
      } else L.push(isDeferred(q.id)?"- **Answer:** DEFERRED":"- **Answer:** _unanswered_");
      if(a&&a.note.trim()) L.push(`- **Notes:** ${a.note.trim().replace(/\n/g,"\n  ")}`);
      L.push("");
    }
  }
  const open=Q.filter(q=>!isAnswered(q.id));
  L.push("## Open items","");
  if(!open.length) L.push("None."); else open.forEach(q=>L.push(`- ${q.id} [${isDeferred(q.id)?"deferred":"unanswered"}, ${q.tag}] ${q.q}`));
  L.push("");
  // machine state so the page can resume; ignore when reading
  L.push("<!-- INQUISITOR-STATE",JSON.stringify(state).replace(/>/g,"\\u003e").replace(/--/g,"-\\u002d"),"-->");
  return L.join("\n")+"\n";
}
function parseState(text){
  const m=text.match(/<!-- INQUISITOR-STATE\s*\n([\s\S]*?)\n-->/); if(!m) return null;
  try{const s=JSON.parse(m[1].replace(/\\u002d/g,"-").replace(/\\u003e/g,">"));return s&&s.answers?s:null}catch(e){return null}
}

/* ---------- persistence ---------- */
function setSave(kind,text){const s=$("#save");s.className=kind;s.textContent=text}
function localSave(){try{state.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function schedule(){
  dirty=true; localSave(); refreshHeader();
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,500);
  if(!dirHandle) setSave("warn",FSA?`Not saved to ${ANSWERS_FILE}: click Connect folder`:"Saved in browser only");
}
async function flush(){
  if(!dirHandle||!dirty) return;
  if(writing){writeAgain=true;return}
  writing=true; dirty=false;
  try{
    const fh=await dirHandle.getFileHandle(ANSWERS_FILE,{create:true});
    const w=await fh.createWritable(); await w.write(buildMd(!!state.finalized)); await w.close();
    setSave("ok",`Saved ${ANSWERS_FILE} at ${new Date().toLocaleTimeString()}`);
  }catch(e){dirty=true;setSave("bad","Write failed: click to reconnect");console.error(e)}
  writing=false; if(writeAgain){writeAgain=false;flush()}
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("inquisitor",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putHandle(h){try{(await idb()).transaction("h","readwrite").objectStore("h").put(h,KEY)}catch(e){}}
async function getHandle(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction("h").objectStore("h").get(KEY);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function attach(h){
  if((await h.requestPermission({mode:"readwrite"}))!=="granted"){toast("Permission denied");return false}
  dirHandle=h; await putHandle(h);
  try{
    const fh=await h.getFileHandle(ANSWERS_FILE); const s=parseState(await (await fh.getFile()).text());
    if(s&&(!state.updated||(s.updated&&s.updated>=state.updated))){state=s;renderAll();toast(`Resumed from ${ANSWERS_FILE}`)}
  }catch(e){/* no file yet */}
  dirty=true; await flush(); return true;
}
async function connect(){
  if(!FSA){toast("This browser cannot write files. Use Chrome or Edge, or Finish to download.");return}
  try{await attach(await showDirectoryPicker({id:"inquisitor",mode:"readwrite"}))}
  catch(e){if(e.name!=="AbortError")toast("Could not connect: "+e.message)}
}
async function reconnect(){
  if(!FSA) return; const h=await getHandle(); if(!h) return;
  try{
    if((await h.queryPermission({mode:"readwrite"}))==="granted") await attach(h);
    else{const s=$("#save");setSave("warn",`Click to reconnect ${h.name}/`);s.style.cursor="pointer";
      s.onclick=async()=>{if(await attach(h)){s.onclick=null;s.style.cursor=""}}}
  }catch(e){}
}
function download(name,text){const a=el("a",{href:URL.createObjectURL(new Blob([text],{type:"text/markdown"})),download:name});document.body.append(a);a.click();a.remove()}

/* ---------- render ---------- */
function refreshHeader(){
  const total=Q.length, done=Q.filter(q=>isAnswered(q.id)).length, def=Q.filter(q=>isDeferred(q.id)).length;
  $("#bar i").style.width=(done/total*100)+"%";
  $("#count").textContent=`${done}/${total} answered · ${def} deferred`;
  for(const s of SECTIONS){
    const qs=Q.filter(q=>q.sec===s.id), d=qs.filter(q=>isAnswered(q.id)).length;
    const a=document.querySelector(`#nav a[data-s="${s.id}"]`); if(a){a.querySelector(".n").textContent=`${d}/${qs.length}`;a.classList.toggle("done",d===qs.length)}
    const sc=document.getElementById("sc-"+s.id); if(sc) sc.textContent=`${d}/${qs.length}`;
  }
}
function recIdx(q){return q.opts.map((o,i)=>o.rec?i:-1).filter(i=>i>=0)}
function renderCard(q){
  const cur=state.answers[q.id]||{sel:[],other:"",note:"",deferred:false,bulk:false};
  const card=el("div",{class:"card"+(isAnswered(q.id)?" answered":isDeferred(q.id)?" deferred":""),id:"q-"+q.id,"data-tag":q.tag,"data-id":q.id});
  card.append(el("div",{class:"qhead"},el("span",{class:"qid"},q.id),el("div",{},el("span",{class:"qtext",html:fmt(q.q)}),el("span",{class:"tag "+q.tag},q.tag))));
  if(q.why) card.append(el("div",{class:"why",html:fmt(q.why)}));
  if(q.opts.length){
    const box=el("div",{class:"opts",role:q.multi?"group":"radiogroup"});
    q.opts.forEach((o,i)=>{
      const inp=el("input",{type:q.multi?"checkbox":"radio",name:"r-"+q.id}); inp.checked=cur.sel.includes(i);
      const lab=el("label",{class:"opt"+(inp.checked?" sel":"")},inp,el("div",{},el("span",{class:"t",html:fmt(o.t)}),o.rec?el("span",{class:"rec"},"Recommended"):null,o.d?el("div",{class:"d",html:fmt(o.d)}):null));
      inp.addEventListener("change",()=>{const A=ans(q.id);
        if(q.multi) A.sel=inp.checked?[...new Set([...A.sel,i])].sort((x,y)=>x-y):A.sel.filter(x=>x!==i); else A.sel=[i];
        A.deferred=false;A.bulk=false;commit(q)});
      box.append(lab);
    });
    card.append(box);
  }
  if(q.rec) card.append(el("div",{class:"recwhy",html:(q.opts.length?"<b>Why I recommend it:</b> ":"")+fmt(q.rec)}));
  const ex=el("div",{class:"extra"});
  const other=el(q.opts.length?"input":"textarea",{type:q.opts.length?"text":null,placeholder:q.text||"Or write your own answer",rows:q.opts.length?null:4});
  other.value=cur.other;
  other.addEventListener("input",()=>{const A=ans(q.id);A.other=other.value;if(other.value.trim())A.deferred=false;A.bulk=false;commit(q,true)});
  ex.append(el("label",{},q.opts.length?"Your own answer (optional, can be combined with the choices)":(q.text||"Answer")),other);
  const note=el("textarea",{placeholder:"Notes, constraints, reasons…",rows:2}); note.value=cur.note;
  note.addEventListener("input",()=>{ans(q.id).note=note.value;schedule()});
  ex.append(el("label",{},"Notes"),note); card.append(ex);
  const row=el("div",{class:"row"});
  if(recIdx(q).length) row.append(el("button",{class:"small",onclick:()=>{const A=ans(q.id);A.sel=recIdx(q);A.deferred=false;A.bulk=false;commit(q)}},"Use recommended"));
  row.append(el("button",{class:"small",onclick:()=>{const A=ans(q.id);A.deferred=!A.deferred;commit(q)}},isDeferred(q.id)?"Un-defer":"Defer"));
  row.append(el("button",{class:"small",onclick:()=>{delete state.answers[q.id];commit(q)}},"Clear"));
  row.append(el("span",{class:"st"},isAnswered(q.id)?(cur.bulk?"answered (accepted in bulk)":"answered"):isDeferred(q.id)?"deferred":"open"));
  card.append(row); return card;
}
function commit(q,keepFocus){
  schedule();
  if(keepFocus){const c=$("#q-"+q.id);c.className="card"+(isAnswered(q.id)?" answered":isDeferred(q.id)?" deferred":"");c.querySelector(".st").textContent=isAnswered(q.id)?"answered":"open";applyFilters();return}
  $("#q-"+q.id).replaceWith(renderCard(q)); applyFilters();
}
function renderIntro(){
  $("#ttl").textContent=SPEC.title;
  const intro=$("#intro"); intro.textContent="";
  intro.append(el("h2",{},"How this works"));
  if(SPEC.subtitle) intro.append(el("p",{html:fmt(SPEC.subtitle)}));
  intro.append(el("ul",{},
    el("li",{html:`<b>Click Connect folder</b> and choose the folder this page is in. Every answer is then written to <code>${esc(ANSWERS_FILE)}</code> there within a second, and restored when you reopen the page. (Chrome or Edge. Elsewhere answers stay in the browser and Finish downloads the file.)`}),
    el("li",{html:`<span class="rec">Recommended</span> marks the suggested option and says why. Pick it, pick another, write your own, add notes, or <b>Defer</b>.`}),
    el("li",{html:"<b>blocker</b> questions change the design; <b>important</b> shape the next steps; <b>later</b> can wait. Use the filters on the left."}),
    el("li",{html:"The per-section bulk button is recorded as <i>accepted in bulk</i>, so a considered answer stays distinguishable from a default."}),
    el("li",{html:`<b>Finish</b> marks the file FINAL. Hand <code>${esc(ANSWERS_FILE)}</code> back to the assistant.`})));
  const ctx=$("#ctx"); ctx.textContent="";
  if(SPEC.context&&SPEC.context.length){
    const d=el("details",{class:"box",id:"reality",open:true},el("summary",{},SPEC.contextTitle||"Context"));
    const cols=el("div",{class:"cols"});
    for(const c of SPEC.context){
      const col=el("div",{}); if(c.heading) col.append(el("h3",{},c.heading));
      if(c.kind==="tension") (c.items||[]).forEach(t=>col.append(el("div",{class:"tension",html:fmt(t)})));
      else col.append(el("ul",{},(c.items||[]).map(t=>el("li",{html:fmt(t)}))));
      cols.append(col);
    }
    d.append(cols); if(SPEC.contextNote) d.append(el("p",{style:"color:var(--mute);font-size:13.5px",html:fmt(SPEC.contextNote)})); ctx.append(d);
  }
}
function renderAll(){
  const root=$("#sections"); root.textContent=""; const nav=$("#nav"); nav.textContent="";
  nav.append(el("div",{class:"filters"},el("label",{},el("input",{type:"checkbox",id:"fBlock"}),"Blockers only"),el("label",{},el("input",{type:"checkbox",id:"fOpen"}),"Unanswered only")));
  for(const s of SECTIONS){
    nav.append(el("a",{href:"#s-"+s.id,"data-s":s.id},el("span",{},`${s.id}. ${s.title.split(":")[0]}`),el("span",{class:"n"},"")));
    const sec=el("section",{class:"sec",id:"s-"+s.id});
    sec.append(el("header",{},el("h2",{},`${s.id}. ${s.title}`),el("div",{class:"bulk"},el("span",{id:"sc-"+s.id,style:"color:var(--mute)"}),
      el("button",{class:"small",title:"Fills unanswered questions that have a recommendation, marked as accepted in bulk",onclick:()=>bulkAccept(s.id)},"Accept recommendations for unanswered"))));
    if(s.blurb) sec.append(el("p",{class:"blurb"},s.blurb));
    Q.filter(q=>q.sec===s.id).forEach(q=>sec.append(renderCard(q)));
    root.append(sec);
  }
  $("#fBlock").onchange=applyFilters; $("#fOpen").onchange=applyFilters; refreshHeader(); applyFilters();
}
function applyFilters(){
  const b=$("#fBlock")&&$("#fBlock").checked, o=$("#fOpen")&&$("#fOpen").checked;
  $$(".card").forEach(c=>{let show=true;if(b&&c.dataset.tag!=="blocker")show=false;if(o&&isAnswered(c.dataset.id))show=false;c.classList.toggle("hide",!show)});
  $$("section.sec").forEach(s=>s.classList.toggle("hide",!s.querySelector(".card:not(.hide)")));
}
function bulkAccept(sid){
  const cand=Q.filter(q=>q.sec===sid&&!isAnswered(q.id)&&recIdx(q).length);
  if(!cand.length){toast("Nothing to accept in this section");return}
  const dlg=$("#dlg"); dlg.textContent="";
  dlg.append(el("h3",{},`Accept recommendations for ${cand.length} questions in section ${sid}?`),
    el("p",{},"They will be recorded as accepted in bulk, not as considered answers. You can still change any of them."),
    el("div",{class:"row"},el("button",{class:"primary",onclick:()=>{cand.forEach(q=>{const A=ans(q.id);A.sel=recIdx(q);A.deferred=false;A.bulk=true});schedule();dlg.close();renderAll()}},"Accept"),el("button",{onclick:()=>dlg.close()},"Cancel")));
  dlg.showModal();
}
function finish(){
  const open=Q.filter(q=>!isAnswered(q.id)), block=open.filter(q=>q.tag==="blocker");
  const dlg=$("#dlg"); dlg.textContent="";
  dlg.append(el("h3",{},"Finish"),
    el("p",{},`${Q.length-open.length} answered, ${open.filter(q=>isDeferred(q.id)).length} deferred, ${open.filter(q=>!isDeferred(q.id)).length} unanswered.`),
    block.length?el("div",{class:"tension"},`${block.length} blocker question${block.length>1?"s are":" is"} still open: ${block.map(q=>q.id).join(", ")}. They will be listed as open; nothing will be assumed.`):el("p",{},"All blockers are answered."),
    el("p",{style:"color:var(--mute);font-size:13.5px"},`This marks ${ANSWERS_FILE} as FINAL. You can still reopen the page and keep editing.`),
    el("div",{class:"row"},
      el("button",{class:"primary",onclick:async()=>{state.finalized=new Date().toISOString();schedule();
        if(dirHandle){await flush();toast(`${ANSWERS_FILE} marked FINAL`)}else{download(ANSWERS_FILE,buildMd(true));toast("Downloaded "+ANSWERS_FILE)}dlg.close()}},"Mark FINAL"),
      el("button",{onclick:async()=>{try{await navigator.clipboard.writeText(buildMd(true));toast("Copied")}catch(e){toast("Clipboard blocked")}}},"Copy markdown"),
      el("button",{onclick:()=>dlg.close()},"Close")));
  dlg.showModal();
}

/* ---------- boot ---------- */
$("#bConnect").onclick=connect; $("#bFinal").onclick=finish;
$("#bTheme").onclick=()=>{const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches,cur=r.dataset.theme||(d?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("inquisitor-theme",r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem("inquisitor-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.answers)state=s}catch(e){}
window.addEventListener("beforeunload",e=>{if(dirty&&dirHandle){e.preventDefault();e.returnValue=""}});
if(typeof module==="undefined"||!module.exports){renderIntro();renderAll();
  setSave("warn",FSA?`Not connected: click Connect folder`:"Saved in browser only (use Chrome/Edge for a file)");
  if(Object.keys(state.answers).length) setSave("warn",FSA?"Restored from browser. Click Connect folder":"Saved in browser only");
  reconnect();}
</script>
</body>
</html>
